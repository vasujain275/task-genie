[project]
name = "task-genie"
version = "1.1.0"
description = "A task management telegram bot powered by an AI agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.22.0",
    "apscheduler>=3.10.4",
    "beanie>=2.0.0",
    "black>=25.9.0",
    "cryptography>=46.0.3",
    "fastapi>=0.119.1",
    "motor>=3.7.1",
    "pydantic>=2.4.1,<2.12",
    "pydantic-settings>=2.11.0",
    "redis>=7.0.1",
    "uvicorn>=0.38.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=3.0.0",
    "langchain-openai>=1.0.0",
    "dateparser>=1.2.0",
    "pytz>=2024.1",
    "langgraph-checkpoint-mongodb>=0.2.2",
    "langsmith>=0.4.43",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = ["pre-commit>=4.4.0", "ruff>=0.14.5"]

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
