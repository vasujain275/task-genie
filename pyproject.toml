[project]
name = "task-genie"
version = "1.1.5"
description = "A task management telegram bot powered by an AI agent."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiogram==3.22.0",
    "apscheduler>=3.10.4",
    "beanie>=2.0.0",
    "black>=25.9.0",
    "cryptography>=46.0.3",
    "fastapi>=0.119.1",
    "motor>=3.7.1",
    "pydantic>=2.4.1,<2.12",
    "pydantic-settings>=2.11.0",
    "redis>=7.0.1",
    "uvicorn>=0.38.0",
    "pocketflow<=0.0.3",
    "pocketflow-tracing>=0.0.1",
    "langfuse>=2.0.0",
    "litellm>=1.70.0",
    "dateparser>=1.2.0",
    "pytz>=2024.1",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "ruff>=0.14.5",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
