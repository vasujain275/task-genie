# Development Docker Compose with MongoDB, Redis, and App
# Builds app from local source (.) instead of Docker Hub

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: task-genie-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
      - mongodb_config_dev:/data/configdb
    networks:
      - task-genie-network-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: task-genie-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - task-genie-network-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Task Genie Application (Built from source)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-genie-app-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override connection strings to use Docker service names
      MONGO_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - task-genie-network-dev
    volumes:
      # Mount source code for hot-reload (optional, uncomment for development)
      # - ./app:/app/app
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data_dev:
    driver: local
  mongodb_config_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  task-genie-network-dev:
    driver: bridge
