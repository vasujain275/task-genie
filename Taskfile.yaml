version: "3"

tasks:
  # -----------------------------
  # Formatting & Linting
  # -----------------------------
  format:
    desc: Format code using Ruff
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix

  lint:
    desc: Lint without fixing
    cmds:
      - uv run ruff check .

  # -----------------------------
  # Development Server
  # -----------------------------
  dev:
    desc: Start FastAPI in development mode
    cmds:
      - uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8080

  # -----------------------------
  # Production Server
  # -----------------------------
  prod:
    desc: Start FastAPI in production mode
    cmds:
      - uv run gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8080 --workers 1
